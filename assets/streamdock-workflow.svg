<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="100%" stop-color="#10121a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="100%" stop-color="#ff7675" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#a8e063" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9999ff" />
      <stop offset="100%" stop-color="#d6a2e8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="#0d0e12" rx="12" />

  <!-- Grid Header -->
  <text x="50" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">STREAMDOCK SYSTEM PIPELINE</text>
  <text x="50" y="62" fill="#757c96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">End-to-end media discovery, preview bridging, and Premiere Pro ExtendScript automation</text>

  <!-- Step 1: Search -->
  <g transform="translate(50, 95)" filter="url(#shadow)">
    <rect width="190" height="215" rx="8" fill="url(#bgBox)" stroke="#23273a" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="4" rx="2" fill="url(#blueGlow)" />
    <circle cx="30" cy="30" r="14" fill="#0078d4" fill-opacity="0.2"/>
    <text x="30" y="34" fill="#00c6ff" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">01</text>
    
    <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">InnerTube Search</text>
    <text x="20" y="92" fill="#8c93ad" font-family="sans-serif" font-size="11" line-height="1.4">Direct HTTP client</text>
    
    <g transform="translate(15, 115)">
      <rect width="160" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">✓ No API key needed</text>
    </g>
    <g transform="translate(15, 145)">
      <rect width="160" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">✓ Sub-second queries</text>
    </g>
    <g transform="translate(15, 175)">
      <rect width="160" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">✓ Rich video metadata</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 252 200 L 278 200" stroke="#3d4460" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="280,200 274,196 274,204" fill="#3d4460" />

  <!-- Step 2: Dual Preview -->
  <g transform="translate(290, 95)" filter="url(#shadow)">
    <rect width="200" height="215" rx="8" fill="url(#bgBox)" stroke="#23273a" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="4" rx="2" fill="url(#redGlow)" />
    <circle cx="30" cy="30" r="14" fill="#ff0033" fill-opacity="0.2"/>
    <text x="30" y="34" fill="#ff7675" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">02</text>
    
    <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Dual Preview Engine</text>
    <text x="20" y="92" fill="#8c93ad" font-family="sans-serif" font-size="11">Real-time playback</text>
    
    <g transform="translate(15, 115)">
      <rect width="170" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">⚡ 127.0.0.1 Bridge (No 153)</text>
    </g>
    <g transform="translate(15, 145)">
      <rect width="170" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">⚡ yt-dlp Stream Pipe</text>
    </g>
    <g transform="translate(15, 175)">
      <rect width="170" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">⚡ VEVO / Music playback</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 502 200 L 528 200" stroke="#3d4460" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="530,200 524,196 524,204" fill="#3d4460" />

  <!-- Step 3: Smart Downloader -->
  <g transform="translate(540, 95)" filter="url(#shadow)">
    <rect width="190" height="215" rx="8" fill="url(#bgBox)" stroke="#23273a" stroke-width="1.5" />
    <rect x="0" y="0" width="190" height="4" rx="2" fill="url(#greenGlow)" />
    <circle cx="30" cy="30" r="14" fill="#2ecc71" fill-opacity="0.2"/>
    <text x="30" y="34" fill="#2ecc71" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">03</text>
    
    <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Codec Transcoding</text>
    <text x="20" y="92" fill="#8c93ad" font-family="sans-serif" font-size="11">Premiere Pro optimized</text>
    
    <g transform="translate(15, 115)">
      <rect width="160" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">🎞️ Forced H.264 (avc1)</text>
    </g>
    <g transform="translate(15, 145)">
      <rect width="160" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">🔊 AAC / MP3 / WAV</text>
    </g>
    <g transform="translate(15, 175)">
      <rect width="160" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">🚫 Zero AV1 Import Error</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M 742 200 L 768 200" stroke="#3d4460" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="770,200 764,196 764,204" fill="#3d4460" />

  <!-- Step 4: Premiere ExtendScript -->
  <g transform="translate(780, 95)" filter="url(#shadow)">
    <rect width="170" height="215" rx="8" fill="url(#bgBox)" stroke="#23273a" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="4" rx="2" fill="url(#purpleGlow)" />
    <circle cx="30" cy="30" r="14" fill="#9999ff" fill-opacity="0.2"/>
    <text x="30" y="34" fill="#d6a2e8" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">04</text>
    
    <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">ExtendScript JSX</text>
    <text x="20" y="92" fill="#8c93ad" font-family="sans-serif" font-size="11">Host Automation</text>
    
    <g transform="translate(15, 115)">
      <rect width="140" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">📁 Auto Project Bin</text>
    </g>
    <g transform="translate(15, 145)">
      <rect width="140" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">⏱️ Insert at Playhead</text>
    </g>
    <g transform="translate(15, 175)">
      <rect width="140" height="24" rx="4" fill="#13151f" />
      <text x="10" y="16" fill="#abb2bf" font-family="monospace" font-size="9.5">🎯 Active Sequence</text>
    </g>
  </g>
</svg>
