op vertical video preview player</text></g><g filter="url(#fShadow)" transform="translate(715, 95)"><rect width="300" height="155" fill="url(#boxBg)" stroke="#23273a" stroke-width="1.5" rx="10"/><rect width="300" height="4" x="0" y="0" fill="url(#c3)" rx="2"/><circle cx="35" cy="35" r="16" fill="#0078d4" fill-opacity=".15"/><text x="35" y="41" fill="#00c6ff" font-family="sans-serif" font-size="15" text-anchor="middle">⚡</text><text x="65" y="40" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">Dual Preview Engine</text><text x="20" y="75" fill="#8c93ad" font-family="sans-serif" font-size="12">Zero Error 153 embedding</text><text x="20" y="95" fill="#a0a5b8" font-family="sans-serif" font-size="11.5">• 127.0.0.1 loopback HTTP server</text><text x="20" y="115" fill="#a0a5b8" font-family="sans-serif" font-size="11.5">• Direct yt-dlp piped stream fallback</text><text x="20" y="135" fill="#a0a5b8" font-family="sans-serif" font-size="11.5">• Music / VEVO playback support</text></g><g filter="url(#fShadow)" transform="translate(45, 275)"><rect width="300" height="155" fill="url(#boxBg)" stroke="#23273a" stroke-width="1.5" rx="10"/><rect width="300" height="4" x="0" y="0" fill="url(#c4)" rx="2"/><circle cx="35" cy="35" r="16" fill="#2ecc71" fill-opacity=".15"/><text x="35" y="41" fill="#2ecc71" font-family="sans-serif" font-size="15" text-anchor="middle">🎞️</text><text x="65" y="40" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">Premiere Codec Engine</text><text x="20" y="75" fill="#8c93ad" font-family="sans-serif" font-size="12">Automatic format transcoding</text><text x="20" y="95" fill="#a0a5b8" font-family="sans-serif" font-size="11.5">• Enforces H.264 (avc1) + AAC (mp4a)</text><text x="20" y="115" fill="#a0a5b8" font-family="sans-serif" font-size="11.5">• Eliminates unsupported AV1 errors</text><text x="20" y="135" fill="#a0a5b8" font-family="sans-serif" font-size="11.5">• Bundled FFmpeg media engine</text></g><g filter="url(#